[package]
name = "vmi-mcp"
version = "0.1.0"
edition = "2021"
description = "User-level MCP workbench for Windows VMs (guest side: born in the interactive session (the only legal birth canal for visible windows), spoken to over loopback streamable-HTTP from any session"
license = "MIT"

[dependencies]
rmcp = { version = "3", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "schemars",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
axum = "0.8"
portable-pty = "0.9"
local-ip-address = "0.6"
schemars = "1.0"

# static CRT: build with RUSTFLAGS="-C target-feature=+crt-static"
[profile.release]
strip = true
lto = "thin"
