[package]
name = "vmi-mcp"
version = "0.6.1"
edition = "2021"
description = "User-level MCP workbench for Windows VMs (guest side: born in the interactive session (the only legal birth canal for visible windows), spoken to over loopback streamable-HTTP from any session"
license = "MIT"

[dependencies]
rmcp = { version = "3", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "client",
    "transport-streamable-http-client-reqwest",
    "schemars",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "io-std", "time"] }
tokio-util = "0.7"
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
axum = "0.8"
portable-pty = "0.9"
local-ip-address = "0.6"
schemars = "1.0"
crossterm = { version = "0.28", features = ["event-stream"] }
reqwest = { version = "0.13", default-features = false }
ratatui = "0.29"
vte = "0.13"
unicode-width = "0.2"

# vmi-attach: raw-terminal attach client; vmi-tui: pane-switching TUI;
# vmi-mcp: the daemon itself
[[bin]]
name = "vmi-mcp"
path = "src/main.rs"

[[bin]]
name = "vmi-attach"
path = "src/attach.rs"

[[bin]]
name = "vmi-tui"
path = "src/tui.rs"

# static CRT: build with RUSTFLAGS="-C target-feature=+crt-static"
[profile.release]
strip = true
lto = "thin"
